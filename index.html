const { useState, useEffect, useCallback, useMemo } = React;

function mapsEmbedUrl(query) { return "https://maps.google.com/maps?q=" + encodeURIComponent(query) + "&z=15&output=embed"; }
function mapsSearchUrl(query) { return "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(query); }
function mapsDirUrl(o, d, m) { return "https://www.google.com/maps/dir/?api=1&origin=" + encodeURIComponent(o) + "&destination=" + encodeURIComponent(d) + "&travelmode=" + m; }
function mapsDayRouteUrl(points, mode) {
  if (points.length < 2) return mapsSearchUrl(points[0] || "");
  const origin = points[0], destination = points[points.length - 1];
  const waypoints = points.slice(1, -1).join("|");
  let url = "https://www.google.com/maps/dir/?api=1&origin=" + encodeURIComponent(origin) + "&destination=" + encodeURIComponent(destination) + "&travelmode=" + mode;
  if (waypoints) url += "&waypoints=" + encodeURIComponent(waypoints);
  return url;
}
function mapsDayEmbedUrl(points) {
  if (points.length < 2) return mapsEmbedUrl(points[0] || "Japan");
  return "https://maps.google.com/maps?saddr=" + encodeURIComponent(points[0]) + "&daddr=" + points.slice(1).map(p => encodeURIComponent(p)).join("+to:") + "&output=embed";
}

const photoCache = {};
function usePlacePhoto(query) {
  const [url, setUrl] = useState(query && photoCache[query] !== undefined ? photoCache[query] : null);
  const [tried, setTried] = useState(query ? photoCache[query] !== undefined : true);
  useEffect(() => {
    let alive = true;
    if (!query) { setTried(true); return; }
    if (photoCache[query] !== undefined) { setUrl(photoCache[query]); setTried(true); return; }
    const api = "https://en.wikipedia.org/w/api.php?action=query&format=json&origin=*&prop=pageimages&piprop=thumbnail&pithumbsize=640&generator=search&gsrlimit=1&gsrsearch=" + encodeURIComponent(query);
    fetch(api).then(r => r.json()).then(j => {
      let found = null;
      const pages = j && j.query && j.query.pages;
      if (pages) for (const k in pages) { if (pages[k].thumbnail) { found = pages[k].thumbnail.source; break; } }
      photoCache[query] = found;
      if (alive) { setUrl(found); setTried(true); }
    }).catch(() => { photoCache[query] = null; if (alive) { setUrl(null); setTried(true); } });
    return () => { alive = false; };
  }, [query]);
  return { url, tried };
}

        {dayStops.map((stop, i) => {
          const realIdx = day.stops.indexOf(stop);
          return <StopCard key={realIdx} stop={stop} idx={realIdx} last={i === dayStops.length - 1 && eveningStops.length === 0} cityIndex={cityIndex} dayIndex={dayIndex} stopIndex={realIdx} cityMeta={cityMeta} editing={editing} onUpdateStop={onUpdateStop} />;
        })}
        {eveningStops.length > 0 && (
          <div>
            <div className="jp-sans" style={{ display: "flex", alignItems: "center", gap: 8, margin: "26px 0 14px", paddingLeft: 4 }}>
              <Moon size={16} /><span style={{ fontSize: 12, letterSpacing: 2, textTransform: "uppercase", color: "#C9B458" }}>Sera</span>
              <div style={{ flex: 1, height: 1, background: "rgba(201,180,88,0.25)" }} />
            </div>
            {eveningStops.map((stop, i) => {
              const realIdx = day.stops.indexOf(stop);
              return <StopCard key={realIdx} stop={stop} idx={realIdx} last={i === eveningStops.length - 1} evening cityIndex={cityIndex} dayIndex={dayIndex} stopIndex={realIdx} cityMeta={cityMeta} editing={editing} onUpdateStop={onUpdateStop} />;
            })}
          </div>
        )}
      </div>
      {day.foods && day.foods.length > 0 && <SectionBlock icon={<Utensils size={16} />} title="Da provare" color="#E4572E" items={day.foods} />}
      {day.optional && day.optional.length > 0 && <SectionBlock icon={<Sparkles size={16} />} title="Opzionale" color="#8E7CC3" items={day.optional} />}
      {day.souvenir && day.souvenir.length > 0 && <SectionBlock icon={<ShoppingBag size={16} />} title="Souvenir" color="#2A9D8F" items={day.souvenir} />}
      {day.notes && day.notes.length > 0 && (
        <div style={{ marginTop: 26, background: "rgba(255,255,255,0.04)", border: "1px solid rgba(255,255,255,0.08)", borderRadius: 12, padding: "16px 18px" }}>
          <div className="jp-sans" style={{ display: "flex", alignItems: "center", gap: 7, fontSize: 12, letterSpacing: 1.5, textTransform: "uppercase", opacity: 0.6, marginBottom: 10 }}><Info size={15} /> Note {cityMeta.romaji}</div>
          <ul style={{ margin: 0, paddingLeft: 18 }}>{day.notes.map((n, i) => <li key={i} className="jp-sans" style={{ fontSize: 13.5, lineHeight: 1.6, marginBottom: 6, opacity: 0.85 }}>{n}</li>)}</ul>
        </div>
      )}
    </div>
  );
}

function DayRouteMap({ points, accent, stops }) {
  const [open, setOpen] = useState(false);
  const named = stops.filter(s => s.maps);
  return (
    <div style={{ border: "1px solid " + accent + "44", borderRadius: 14, overflow: "hidden", background: "rgba(255,255,255,0.03)" }}>
      <button className="jp-sans" onClick={() => setOpen(o => !o)} style={{ width: "100%", display: "flex", alignItems: "center", gap: 10, background: "none", border: "none", color: "#E8E2D5", cursor: "pointer", padding: "13px 15px", textAlign: "left" }}>
        <span style={{ color: accent, display: "flex" }}><Route size={18} /></span>
        <span style={{ flex: 1, fontSize: 14, fontWeight: 600 }}>Percorso della giornata \u00b7 {points.length} tappe</span>
        <span style={{ transform: open ? "rotate(90deg)" : "none", transition: "transform .2s", opacity: 0.6, display: "flex" }}><ChevronRight size={18} /></span>
      </button>
      {open && (
        <div>
          <div style={{ aspectRatio: "16 / 10", background: "#1a2b47", borderTop: "1px solid " + accent + "33" }}>
            <iframe title="Percorso" src={mapsDayEmbedUrl(points)} style={{ width: "100%", height: "100%", border: 0 }} loading="lazy" referrerPolicy="no-referrer-when-downgrade" />
          </div>
          <div style={{ padding: "12px 15px", display: "flex", flexDirection: "column", gap: 6 }}>
            <div className="jp-sans" style={{ fontSize: 11.5, opacity: 0.55, marginBottom: 2 }}>Ordine del giorno:</div>
            <div style={{ display: "flex", flexWrap: "wrap", gap: 6, alignItems: "center" }}>
              {named.map((s, i) => (
                <React.Fragment key={i}>
                  <span className="jp-sans" style={{ fontSize: 12, background: s.evening ? "rgba(201,180,88,0.15)" : accent + "22", color: "#E8E2D5", borderRadius: 20, padding: "3px 10px", display: "inline-flex", alignItems: "center", gap: 5 }}>
                    <span style={{ fontWeight: 700, color: s.evening ? "#C9B458" : accent }}>{i + 1}</span>{s.title}
                  </span>
                  {i < named.length - 1 && <span style={{ opacity: 0.3, fontSize: 12 }}>\u2192</span>}
                </React.Fragment>
              ))}
            </div>
            <div style={{ display: "flex", gap: 8, flexWrap: "wrap", marginTop: 8 }}>
              <a className="jp-sans" href={mapsDayRouteUrl(points, "transit")} target="_blank" rel="noreferrer" style={{ display: "flex", alignItems: "center", gap: 6, background: accent, color: "#0F1A2E", textDecoration: "none", borderRadius: 8, padding: "8px 12px", fontSize: 12.5, fontWeight: 600 }}><Navigation size={14} /> Apri percorso in Google Maps</a>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

function StopCard({ stop, idx, last, evening, cityIndex, dayIndex, stopIndex, cityMeta, editing, onUpdateStop }) {
  const [showMap, setShowMap] = useState(false);
  const accent = evening ? "#C9B458" : cityMeta.color;
  const photo = usePlacePhoto(stop.maps);
  return (
    <div style={{ display: "flex", gap: 14, position: "relative" }}>
      <div style={{ display: "flex", flexDirection: "column", alignItems: "center", flexShrink: 0, width: 52 }}>
        <div className="jp-sans" style={{ fontSize: 13, fontWeight: 700, color: accent, marginTop: 2 }}>{stop.time}</div>
        <div style={{ width: 22, height: 22, borderRadius: "50%", background: accent, color: "#0F1A2E", display: "flex", alignItems: "center", justifyContent: "center", fontWeight: 800, fontSize: 12, marginTop: 6, boxShadow: "0 0 0 4px #0F1A2E" }}>{idx + 1}</div>
        {!last && <div style={{ flex: 1, width: 2, background: "rgba(255,255,255,0.12)", marginTop: 2, minHeight: 30 }} />}
      </div>
      <div className="stop-card" style={{ flex: 1, marginBottom: 16, background: "rgba(255,255,255,0.045)", border: "1px solid rgba(255,255,255,0.08)", borderRadius: 12, overflow: "hidden" }}>
        {stop.maps && (
          <div style={{ position: "relative", aspectRatio: "16 / 9", background: "#16263f" }}>
            {photo.url
              ? <img src={photo.url} alt={stop.title} loading="lazy" style={{ width: "100%", height: "100%", objectFit: "cover", display: "block" }} />
              : <div className={photo.tried ? "" : "ph-shimmer"} style={{ width: "100%", height: "100%", display: "flex", alignItems: "center", justifyContent: "center", color: "rgba(255,255,255,0.25)" }}>{photo.tried ? <MapPin size={30} /> : null}</div>}
            <div style={{ position: "absolute", inset: 0, background: "linear-gradient(180deg, transparent 55%, rgba(15,26,46,0.85))" }} />
          </div>
        )}
        <div style={{ padding: "14px 16px" }}>
          {editing
            ? <input className="edit-in" value={stop.title} onChange={e => onUpdateStop(cityIndex, dayIndex, stopIndex, "title", e.target.value)} style={{ fontSize: 17, fontWeight: 600, marginBottom: 8 }} />
            : <h3 style={{ fontSize: 17.5, fontWeight: 600, margin: "0 0 6px" }}>{stop.title}</h3>}
          {editing
            ? <textarea className="edit-in jp-sans" rows={2} value={stop.desc} onChange={e => onUpdateStop(cityIndex, dayIndex, stopIndex, "desc", e.target.value)} style={{ fontSize: 13.5, marginBottom: 8 }} />
            : (stop.desc ? <p className="jp-sans" style={{ fontSize: 13.5, lineHeight: 1.55, margin: "0 0 10px", opacity: 0.82 }}>{stop.desc}</p> : null)}
          {stop.foods && stop.foods.length > 0 && (
            <div style={{ margin: "0 0 10px", display: "flex", flexDirection: "column", gap: 6 }}>
              {stop.foods.map((f, i) => (
                <a key={i} href={f.maps ? mapsSearchUrl(f.maps) : undefined} target="_blank" rel="noreferrer" className="jp-sans" style={{ display: "flex", gap: 8, alignItems: "flex-start", textDecoration: "none", color: "inherit", background: "rgba(228,87,46,0.08)", borderRadius: 8, padding: "7px 10px" }}>
                  <span style={{ color: "#E4572E", marginTop: 2, display: "flex" }}><Utensils size={13} /></span>
                  <span style={{ fontSize: 12.5, lineHeight: 1.45 }}><b>{f.name}</b>{f.desc ? " \u2014 " + f.desc : ""}</span>
                </a>
              ))}
            </div>
          )}
          {stop.tip && !editing && <div className="jp-sans" style={{ fontSize: 12.5, lineHeight: 1.5, background: "rgba(201,180,88,0.1)", borderLeft: "3px solid #C9B458", borderRadius: "0 6px 6px 0", padding: "7px 10px", margin: "0 0 10px", opacity: 0.9 }}>\ud83d\udca1 {stop.tip}</div>}
          {stop.maps && (
            <div>
              <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
                <button className="jp-sans" onClick={() => setShowMap(s => !s)} style={{ display: "flex", alignItems: "center", gap: 6, background: showMap ? accent : "rgba(255,255,255,0.08)", color: showMap ? "#0F1A2E" : "#E8E2D5", border: "none", borderRadius: 8, padding: "7px 11px", cursor: "pointer", fontSize: 12.5, fontWeight: 500 }}><MapPin size={14} /> {showMap ? "Nascondi mappa" : "Mostra mappa"}</button>
                <a className="jp-sans" href={mapsSearchUrl(stop.maps)} target="_blank" rel="noreferrer" style={{ display: "flex", alignItems: "center", gap: 6, background: "rgba(255,255,255,0.08)", color: "#E8E2D5", textDecoration: "none", borderRadius: 8, padding: "7px 11px", fontSize: 12.5 }}><Navigation size={14} /> Indicazioni</a>
              </div>
              {showMap && (
                <div style={{ marginTop: 10, borderRadius: 12, overflow: "hidden", border: "1px solid " + accent + "55", aspectRatio: "1 / 1", background: "#1a2b47" }}>
                  <iframe title={"Mappa " + stop.title} src={mapsEmbedUrl(stop.maps)} style={{ width: "100%", height: "100%", border: 0 }} loading="lazy" referrerPolicy="no-referrer-when-downgrade" />
                </div>
              )}
            </div>
          )}
          {stop.move && !editing && (
            <div className="jp-sans" style={{ marginTop: 10, fontSize: 12, opacity: 0.7, display: "flex", flexWrap: "wrap", gap: 8, alignItems: "center" }}>
              <span style={{ opacity: 0.7 }}>\u2794 prossima tappa:</span>
              {stop.move.walk && <a href={mapsDirUrl(stop.move.walk.origin, stop.move.walk.destination, "walking")} target="_blank" rel="noreferrer" style={{ color: accent, textDecoration: "none", border: "1px solid " + accent + "55", borderRadius: 6, padding: "3px 8px" }}>\ud83d\udeb6 a piedi</a>}
              {stop.move.transit && <a href={mapsDirUrl(stop.move.transit.origin, stop.move.transit.destination, "transit")} target="_blank" rel="noreferrer" style={{ color: accent, textDecoration: "none", border: "1px solid " + accent + "55", borderRadius: 6, padding: "3px 8px" }}>\ud83d\ude86 treno/bus</a>}
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

function SectionBlock({ icon, title, color, items }) {
  return (
    <div style={{ marginTop: 26 }}>
      <div className="jp-sans" style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 12 }}>
        <span style={{ color }}>{icon}</span>
        <span style={{ fontSize: 12, letterSpacing: 2, textTransform: "uppercase", color }}>{title}</span>
        <div style={{ flex: 1, height: 1, background: color + "33" }} />
      </div>
      <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
        {items.map((it, i) => (
          <a key={i} href={it.maps ? mapsSearchUrl(it.maps) : undefined} target="_blank" rel="noreferrer" className="jp-sans" style={{ display: "flex", gap: 10, alignItems: "flex-start", textDecoration: "none", color: "inherit", background: "rgba(255,255,255,0.04)", border: "1px solid rgba(255,255,255,0.08)", borderRadius: 10, padding: "11px 13px" }}>
            <span style={{ color, marginTop: 2, display: "flex" }}><MapPin size={15} /></span>
            <div>
              <div style={{ fontSize: 14, fontWeight: 600 }}>{it.name}</div>
              {it.desc && <div style={{ fontSize: 12.5, opacity: 0.7, lineHeight: 1.45, marginTop: 2 }}>{it.desc}</div>}
            </div>
          </a>
        ))}
      </div>
    </div>
  );
}

function JapanMap({ data, flatDays, activeDay, onPick }) {
  const W = JAPAN_MAP.viewBox[2], H = JAPAN_MAP.viewBox[3];
  const routePts = data.cities.map(c => ({ name: c.city, xy: JAPAN_MAP.cities[c.city] })).filter(p => p.xy);
  const linePath = routePts.map((p, i) => (i === 0 ? "M" : "L") + p.xy[0] + "," + p.xy[1]).join(" ");
  const firstDayIndexForCity = (ci) => flatDays.findIndex(f => f.cityIndex === ci);
  const activeCityName = flatDays[activeDay] && flatDays[activeDay].city.city;
  return (
    <div>
      <p className="jp-sans" style={{ fontSize: 13.5, lineHeight: 1.6, opacity: 0.75, margin: "0 0 16px" }}>Il percorso completo attraverso l'arcipelago \u2014 tocca una tappa per aprirne le giornate.</p>
      <div style={{ borderRadius: 16, overflow: "hidden", border: "1px solid rgba(255,255,255,0.1)", background: "linear-gradient(180deg,#0d1728,#12263f)" }}>
        <svg viewBox={"0 0 " + W + " " + H} style={{ width: "100%", display: "block" }} role="img" aria-label="Mappa del Giappone">
          <defs><pattern id="sea" width="26" height="26" patternUnits="userSpaceOnUse"><path d="M26 0H0V26" fill="none" stroke="rgba(255,255,255,0.03)" strokeWidth="1" /></pattern></defs>
          <rect x="0" y="0" width={W} height={H} fill="url(#sea)" />
          {JAPAN_MAP.paths.map((d, i) => <path key={i} d={d} fill="#20344f" stroke="#3c5a80" strokeWidth="1.2" />)}
          <path d={linePath} fill="none" stroke="#E4572E" strokeWidth="2.5" strokeLinejoin="round" strokeLinecap="round" strokeDasharray="1 7" opacity="0.9" />
          <path d={linePath} fill="none" stroke="#E4572E" strokeWidth="2.5" strokeLinejoin="round" strokeLinecap="round" opacity="0.22" />
          {data.cities.map((c, ci) => {
            const xy = JAPAN_MAP.cities[c.city];
            if (!xy) return null;
            const meta = CITY_META[c.city] || {};
            const isActive = c.city === activeCityName;
            const labelLeft = xy[0] > W * 0.78;
            return (
              <g key={ci} style={{ cursor: "pointer" }} onClick={() => onPick(firstDayIndexForCity(ci))}>
                <circle cx={xy[0]} cy={xy[1]} r={isActive ? 13 : 9} fill={meta.color} opacity="0.25" />
                <circle cx={xy[0]} cy={xy[1]} r={isActive ? 8 : 6} fill={meta.color} stroke="#0F1A2E" strokeWidth="2" />
                <text x={labelLeft ? xy[0] - 12 : xy[0] + 12} y={xy[1] + 4} textAnchor={labelLeft ? "end" : "start"} fontSize="14" fontWeight="700" fill="#E8E2D5" style={{ fontFamily: "'Helvetica Neue',system-ui,sans-serif", paintOrder: "stroke", stroke: "#0F1A2E", strokeWidth: 3 }}>{meta.romaji}</text>
              </g>
            );
          })}
        </svg>
      </div>
      <div style={{ marginTop: 20, display: "flex", flexDirection: "column", gap: 8 }}>
        {data.cities.map((c, ci) => {
          const meta = CITY_META[c.city] || {};
          const flatIdx = firstDayIndexForCity(ci);
          const isActive = c.city === activeCityName;
          return (
            <button key={ci} className="jp-sans" onClick={() => onPick(flatIdx)} style={{ display: "flex", alignItems: "center", gap: 12, textAlign: "left", width: "100%", background: isActive ? "rgba(255,255,255,0.07)" : "rgba(255,255,255,0.035)", border: "1px solid " + (isActive ? meta.color + "88" : "rgba(255,255,255,0.08)"), borderRadius: 10, padding: "11px 13px", cursor: "pointer", color: "#E8E2D5" }}>
              <span style={{ width: 34, height: 34, borderRadius: "50%", background: meta.color, color: "#0F1A2E", display: "flex", alignItems: "center", justifyContent: "center", fontWeight: 800, fontSize: 14, flexShrink: 0 }}>{meta.kanji.slice(0, 1)}</span>
              <div style={{ flex: 1, minWidth: 0 }}>
                <div style={{ fontSize: 15, fontWeight: 600 }}>{meta.romaji} <span style={{ color: meta.color }}>{meta.kanji}</span></div>
                <div style={{ fontSize: 12, opacity: 0.6 }}>Giorni {c.dayrange} \u00b7 {c.days.length} {c.days.length === 1 ? "giornata" : "giornate"}</div>
              </div>
              <span style={{ opacity: 0.5, flexShrink: 0, display: "flex" }}><ChevronRight size={18} /></span>
            </button>
          );
        })}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);

</script>
</body>
</html>
